name: Rajaniesh Kaushikk
title: Director Technology | Microsoft MVP | Databricks MVP| Databricks Champion | MCT | Author | Blogger
bio: >-
  Meet Rajaniesh Kaushikk – a Microsoft MVP and TOGAF Certified Enterprise
  Architect with over 22 years of experience in delivering complex software
  architectures for Fortune 500 companies. Rajaniesh specializes in data
  integration, governance, and analysis, with a proven track record in
  defining technical architectures, designing analytic solutions, and
  developing agile frameworks. His expertise spans Hybrid Cloud, Azure Cloud,
  Power BI, Kubernetes, Databricks Lakehouse, Snowflake, and more, making him
  a trusted partner in solving intricate business challenges and driving
  market growth.<br><br>As a hands-on technical architect, Microsoft Certified
  Solution Architect, and Databricks Champion, Rajaniesh excels in translating
  complex concepts into actionable strategies, whether through pre-sales
  technical presentations or public speaking at Microsoft events. A Microsoft
  Certified Trainer, he is committed to sharing his knowledge and staying at
  the forefront of technological advancements, ensuring scalable and
  innovative solutions for modern software architecture needs.
talkName: 'My agents bankrupted me: the hidden economics of multi-agent systems in production'
