name: Melissa M. Reeve
title: Founder of HyperadaptiveSolutions, Author of "Hyperadaptive"
bio: >-
  Melissa Reeve brings a unique interdisciplinary perspective shaped by over
  three decades at the intersection of executive leadership, organizational
  transformation, and process excellence. Her foundation in the Lean mindset
  began at Waseda University in Tokyo, where she studied the Toyota Production
  System and witnessed Hino Motor Company's Andon cords in action. This early
  exposure to process excellence informed her pioneering work with Agile
  marketing from 2011. As the first VP of Marketing at Scaled Agile and thought
  leader in the SAFe in Marketing space, Melissa immersed herself in systems
  thinking, Total Quality Management, DevOps, and Lean principles. She went on
  to co-found the Agile Marketing Alliance, where she built a community of
  Agile marketing practitioners and gained firsthand insight into the
  challenges of organizational change. Recognizing the enormous impact of AI
  with ChatGPT's introduction in November 2022, Melissa dedicated herself to
  researching AI's organizational impacts. Hyperadaptive represents the
  culmination of this work, offering a synthesis of process excellence,
  organizational evolution, and the human side of AI integration that provides
  leaders with a practical pathway to becoming AI-native enterprises.
talkName: 'Becoming Hyperadaptive: Where Are You on the AI Adoption Journey?'
