name: Bodhisattva Das
title: Security Engineer - RUDRA Cybersecurity
bio: >-
  Bodhisattva Das is a Security Engineer at Rudra Cybersecurity, focused on
  securing non-human identities, AI agents, and automated workloads across
  cloud environments. He specialises in open-source threat detection using
  Wazuh, and builds practical solutions for identity governance and AI-driven
  security operations. Driven by a passion for digital rights and responsible
  AI governance, he strives to build secure systems that protect people as
  technology evolves. Outside of work, he enjoys traveling and exchanging
  ideas with global tech communities.
talkName: 'Every Merge Mints an Admin: Shift-Left Security for AI Agents and Non-Human Identities'
photo: /src/assets/speakers/bodhisattva-das/photo.png
keynote: true
